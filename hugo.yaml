baseURL: https://example.org/
languageCode: en-US
title: Hugo Agent Zero

minify:
  tdewolff:
    html:
      keepComments: true

taxonomies:
  author: authors
  category: categories
  tag: tags

menus:
  main:
    - name: Home
      pageRef: /
      weight: 10
    - name: About
      pageRef: /about
      weight: 20
    - name: Blog
      pageRef: /blog
      weight: 30
    - name: Page Test
      pageRef: /pages/page-test
      weight: 15

  tertiary:
    - name: About
      pageRef: /about
      weight: 10
    - name: Blog
      pageRef: /blog
      weight: 20
    - name: Page Test
      pageRef: /pages/page-test
      weight: 30
    - name: Team
      pageRef: /about/team
      weight: 40

  # Social/profile links (stub for future use)
  # social:
  #   - name: GitHub
  #     url: https://github.com/your-org
  #     weight: 10
  #     params:
  #       rel: me noopener noreferrer
  #   - name: LinkedIn
  #     url: https://linkedin.com/in/your-profile
  #     weight: 20
  #     params:
  #       rel: me noopener noreferrer

module:
  hugoVersion:
    extended: false
    min: 0.146.0
  imports:
    - path: github.com/hugo-agent-zero/hugo-agent-zero-core
    - path: github.com/hugoagentzero-com/haz-com-content
      mounts:
        - source: content
          target: content
